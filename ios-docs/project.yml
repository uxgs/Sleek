# Sleek Docs for iPhone. `./make.sh` turns this into an Xcode project (with xcodegen) and builds it.
# The app carries Sleek's own pages inside and shows them with native bars around them; it compiles the
# shared pieces in ../ios-shared and three files of the Mac browser as they are.
name: SleekDocs
options:
  bundleIdPrefix: com.sleek
  deploymentTarget:
    iOS: "17.0"
targets:
  SleekDocs:
    type: application
    platform: iOS
    dependencies:
      - target: SleekDocsWidgets
    sources:
      - path: Sources
      - path: ../ios-shared/Shared.swift
      - path: ../ios-shared/SharedWork.swift
      - path: ../ios-shared/Kit.swift
      - path: ../ios-shared/Host.swift
      - path: ../browser/Sources/Sleek/Common.swift
      - path: ../browser/Sources/Sleek/Work.swift
      - path: ../browser/Sources/Sleek/Known.swift
      - path: Assets.xcassets
      - path: build/inside/app
        type: folder
      - path: build/inside/chrome
        type: folder
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Sleek Docs
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
        # the Sleek browser opens a board, page or deck here by this address
        CFBundleURLTypes:
          - CFBundleURLName: com.sleek.docs
            CFBundleURLSchemes: [sleek-docs]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sleek.file
            UTTypeDescription: Sleek file
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [sleek]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sleek file
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.sleek.file]
    entitlements:
      path: build/SleekDocs.entitlements
      properties:
        com.apple.security.application-groups: [group.com.uxg.sleek]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleek.docs
        PRODUCT_NAME: SleekDocs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
  # the app's widgets (drawn by ../ios-shared/Widgets.swift), reading the work the Sleek apps share
  SleekDocsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: ../ios-shared/Widgets.swift
      - path: ../ios-shared/Shared.swift
      - path: ../ios-shared/Aisles.swift
      - path: ../ios-shared/Siri.swift
      - path: ../ios-shared/Goals.swift
    info:
      path: build/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Sleek Docs
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: build/SleekDocsWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.uxg.sleek]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleek.docs.widgets
        PRODUCT_NAME: SleekDocsWidgets
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
