<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwords</title>
<style>
  /* Sleek's Passwords page (sleek://ui/passwords.html). Locked, it shows nothing but how many are saved.
     Unlocked (Touch ID, asked by the app), it lists every sign-in, says which are worth changing, and
     shows one in full: its name, its password behind dots, how good the password is, and a stronger
     one if you want it. The page never holds passwords it has not been asked to show: the app hands
     over one at a time (Sources/Sleek/Passwords.swift), and copying is done by the app, which clears
     the clipboard a minute later. */
  :root { --bg: #FFFFFF; --raise: #FFFFFF; --fg: #1D1D1F; --muted: #6E6E73; --faint: #8E8E93; --line: rgba(0,0,0,0.10); --line2: rgba(0,0,0,0.18); --hover: rgba(0,0,0,0.05);
          --accent: #7C5CFF; --good: #12A36A; --warn: #D43C2F; --amber: #C98A12; --bloom: .5; --ff: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E0E11; --raise: #17171B; --fg: #F2F2F5; --muted: #A1A1A6; --faint: #7C7C84; --line: rgba(255,255,255,0.10); --line2: rgba(255,255,255,0.20); --hover: rgba(255,255,255,0.07);
          --good: #5EE0A0; --warn: #FF7B72; --amber: #F0B34A; --bloom: .7; color-scheme: dark; } }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%), var(--bg); background-attachment: fixed; color: var(--fg); font: 14.5px/1.45 var(--ff); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :is(button, a, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  /* a box you type in: a ring that follows its shape, and a soft light behind it */
  input[type=text], input[type=password] { height: 36px; border-radius: 10px; border: 1.5px solid var(--line2); background: var(--raise); padding: 0 11px; outline: none; min-width: 0; transition: border-color .15s ease, box-shadow .25s ease; }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent), 0 8px 22px -8px color-mix(in srgb, var(--accent) 60%, transparent); }

  /* ---------- locked ---------- */
  .locked { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; text-align: center; }
  .locked > div { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 400px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  .ring { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(from 210deg, #7E9CFF, #B48CFF, #FF8EE0, #7E9CFF); padding: 3px; box-shadow: 0 24px 50px -22px color-mix(in srgb, var(--accent) 70%, transparent); position: relative; }
  .ring::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: conic-gradient(from 210deg, #7E9CFF, #B48CFF, #FF8EE0, #7E9CFF); filter: blur(26px); opacity: calc(var(--bloom) * .7); z-index: -1; }
  .ring > span { width: 100%; height: 100%; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }
  .ring svg { width: 38px; height: 38px; fill: none; stroke: var(--fg); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .locked h1 { margin: 6px 0 0; font-size: 26px; font-weight: 650; letter-spacing: -0.025em; } .locked p { margin: 0; color: var(--muted); }
  .cta { height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--fg); color: var(--bg); font-weight: 600; cursor: pointer; box-shadow: 0 14px 30px -16px rgba(0,0,0,.5); transition: transform .2s ease, box-shadow .25s ease; }
  .cta:hover { transform: translateY(-1px); box-shadow: 0 18px 34px -14px color-mix(in srgb, var(--accent) 80%, transparent); } .cta:active { transform: scale(.97); }
  .small { font-size: 12.5px; }

  /* ---------- unlocked ---------- */
  .vin { max-width: 1040px; margin: 0 auto; padding: 30px 24px 48px; display: flex; flex-direction: column; gap: 18px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .vtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .vtop h1 { margin: 0 auto 0 0; font-size: 28px; font-weight: 650; letter-spacing: -0.025em; }
  .vfind { width: 220px; max-width: 100%; border-radius: 999px !important; padding: 0 14px !important; }
  .vbtn { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: none; cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: background .15s ease, border-color .15s ease, transform .12s ease; }
  .vbtn:hover { background: var(--hover); } .vbtn:active { transform: scale(.96); } .vbtn.warn { color: var(--warn); } .vbtn.main { background: var(--fg); color: var(--bg); border-color: transparent; } .vbtn.main:hover { opacity: .9; }
  .health { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .hc { text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; background: var(--raise); cursor: pointer; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s ease, transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease; }
  .hc:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: 0 16px 30px -22px var(--hc, var(--accent)); } .hc.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .hc b { font: 650 24px/1.1 var(--ff); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; } .hc span { font-size: 12.5px; color: var(--muted); } .hc.bad { --hc: var(--warn); } .hc.bad b { color: var(--warn); } .hc.fine { --hc: var(--good); } .hc.fine b { color: var(--good); }
  .vcols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
  .vlist { border: 1px solid var(--line); border-radius: 18px; background: var(--raise); padding: 6px; display: flex; flex-direction: column; gap: 1px; max-height: calc(100vh - 250px); overflow-y: auto; }
  .vrow { display: flex; align-items: center; gap: 11px; padding: 9px; border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; width: 100%; transition: background .15s ease; } .vrow:hover { background: var(--hover); } .vrow.on { background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .mono { position: relative; overflow: hidden; flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font: 700 14px var(--ff); background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 60%, #fff)); }
  .mono img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--raise); }
  .vrow span { flex: 1; min-width: 0; } .vrow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .vrow small { color: var(--muted); font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vrow em { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); } .vrow em.amber { background: var(--amber); }
  .none { padding: 14px; margin: 0; color: var(--muted); }
  .vcard { border: 1px solid var(--line); border-radius: 22px; background: var(--raise); overflow: hidden; box-shadow: 0 30px 60px -40px rgba(0,0,0,.45); animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .vhead { display: flex; align-items: center; gap: 14px; padding: 22px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 22%, var(--raise)), var(--raise) 70%); border-bottom: 1px solid var(--line); }
  .vhead .mono { width: 54px; height: 54px; border-radius: 16px; font-size: 22px; box-shadow: 0 12px 24px -12px var(--c); } .vhead > span { min-width: 0; flex: 1; } .vhead b { display: block; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; } .vhead small { color: var(--muted); font-size: 13px; }
  .vbody { padding: 8px 22px 20px; display: flex; flex-direction: column; }
  .vf { display: flex; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); } .vf > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .vf label { display: block; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-bottom: 3px; }
  .vf code { font: 15px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .02em; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; } .vf b { font-weight: 500; font-size: 15px; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  .meter { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; margin-top: 8px; } .meter i { display: block; height: 100%; width: var(--w); border-radius: 3px; background: var(--mc); transition: width .5s cubic-bezier(.2,.8,.2,1), background .3s ease; }
  .verdict { font-size: 13px; margin-top: 6px; color: var(--muted); } .verdict b { font-weight: 600; font-size: 13px; }
  .gen { margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--hover); display: flex; flex-direction: column; gap: 10px; animation: rise .3s cubic-bezier(.2,.8,.2,1) both; } .gen code { font: 16px ui-monospace, "SF Mono", Menlo, monospace; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  .gen input[type=range] { flex: 1; min-width: 80px; accent-color: var(--accent); }
  .frow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--hover); } .seg button { height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 12.5px; color: var(--muted); } .seg button.on { background: var(--raise); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .vfoot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 14px; font-size: 12.5px; color: var(--muted); } .vfoot span { margin-right: auto; }
  .form { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px 12px; align-items: center; padding: 16px 0 4px; } .form label { font-size: 13px; color: var(--muted); } .form .frow { grid-column: 2; }
  .settings { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--muted); }
  .sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--fg); } .sw button { flex: none; width: 38px; height: 22px; border-radius: 11px; border: 0; background: var(--line2); position: relative; cursor: pointer; transition: background .2s ease; }
  .sw button::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s cubic-bezier(.2,.8,.2,1); } .sw button[aria-checked="true"] { background: var(--good); } .sw button[aria-checked="true"]::after { transform: translateX(16px); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 13px; background: var(--hover); color: var(--fg); font-size: 12.5px; } .chip button { border: 0; background: none; cursor: pointer; padding: 0 4px; color: var(--muted); }
  .vnote { text-align: center; font-size: 12.5px; color: var(--faint); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 12px; background: #1C1C21; color: #F2F2F5; font-size: 13px; box-shadow: 0 14px 30px -14px rgba(0,0,0,.6); animation: toastIn .28s cubic-bezier(.2,.8,.2,1) both; z-index: 9; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
  @media (max-width: 760px) { .vcols, .health { grid-template-columns: minmax(0, 1fr); } .vlist { max-height: 260px; } .form { grid-template-columns: minmax(0, 1fr); } .form .frow { grid-column: 1; } }
  @media (prefers-reduced-motion: reduce) { .locked > div, .vin, .vcard, .gen, .toast { animation: none; } .meter i, .hc, .cta { transition: none; } }
  .still .locked > div, .still .vin, .still .vcard, .still .gen, .still .toast { animation: none; } .still .meter i { transition: none; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  function post(m){ try { window.webkit.messageHandlers.sleekPage.postMessage(m); } catch(e){} }
  function ask(what, more){ var m = more || {}; m.vault = what; post(m); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var app = document.getElementById('app');
  // S is what the app last said (open or locked, how many, the sign-ins without their passwords); U is what this page is showing of it
  var S = { open: false, count: 0, items: [], never: [], offer: true, unreadable: false };
  var U = { sel: null, filter: '', q: '', shown: null, gen: null, words: false, length: 20, edit: null, add: null, del: 0, more: false, toast: null };
  var COLORS = ['#7C5CFF', '#0A84FF', '#12A36A', '#F0642D', '#E0457B', '#C2A21E', '#5B6470', '#17A2B8'];
  function colour(site){ var h = 0; for(var i = 0; i < site.length; i++) h = (h * 31 + site.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }
  function mono(p){ return '<i class="mono" style="--c:' + colour(p.site) + '">' + esc((p.site.charAt(0) || '?').toUpperCase()) + '<img src="sleek://ui/_icon/' + esc(p.site) + '" alt="" onerror="this.remove()"></i>'; }
  function when(at){ if(!at) return 'never'; var d = new Date(at * 1000), now = new Date(), days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days < 7 ? days + ' days ago' : days < 60 ? Math.round(days / 7) + ' weeks ago' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
  var LOCK = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.500"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  function verdict(p){
    if(p.verdict === 'strong') return ['Strong', 'It would take centuries to guess.', '100%', 'var(--good)'];
    if(p.verdict === 'fair') return ['Could be stronger', 'Longer, or with more kinds of character, would be safer.', '62%', 'var(--amber)'];
    if(p.verdict === 'reused') return ['Used on ' + p.sharedWith + ' sites', 'If one site leaks it, the others are open too.', '48%', 'var(--amber)'];
    return ['Weak', 'Short or common. Easy to guess.', '22%', 'var(--warn)'];
  }
  function toast(text){ U.toast = text; paint(); clearTimeout(toast.t); toast.t = setTimeout(function(){ U.toast = null; paint(); }, 3600); }

  function paint(){
    var act = document.activeElement, keep = act && act.id ? act.id : null, a0 = keep && act.selectionStart != null ? act.selectionStart : null, a1 = keep && act.selectionEnd != null ? act.selectionEnd : null;
    var listY = (app.querySelector('.vlist') || {}).scrollTop || 0, h;
    if(!S.open){
      h = '<div class="locked"><div><div class="ring"><span>' + LOCK + '</span></div><h1>Your passwords are locked</h1>' +
        (S.unreadable ? '<p>The key to them is not in this Mac’s Keychain, so they cannot be opened here. The file itself has not been touched.</p>'
                      : '<p>They are kept on this Mac, encrypted, and never leave it. Only you can open them.</p><button type="button" class="cta" data-v="unlock" id="unlock">Unlock with Touch ID</button>') +
        '<p class="small">' + S.count + ' saved · locks again after 5 minutes</p></div></div>';
    } else {
      var all = S.items || [], q = U.q.toLowerCase(), weak = all.filter(function(p){ return p.verdict === 'weak'; }).length, reused = all.filter(function(p){ return p.verdict === 'reused'; }).length;
      var list = all.filter(function(p){ return (!U.filter || p.verdict === U.filter) && (!q || (p.site + ' ' + p.user).toLowerCase().indexOf(q) >= 0); });
      var cur = list.filter(function(p){ return p.id === U.sel; })[0] || list[0] || null; if(cur) U.sel = cur.id;
      h = '<div class="vin"><div class="vtop"><h1>Passwords</h1><input type="text" class="vfind" id="vq" placeholder="Find a site or a name" aria-label="Find a site or a name" value="' + esc(U.q) + '" autocomplete="off" spellcheck="false">' +
        '<button type="button" class="vbtn main" data-v="add">Add</button><button type="button" class="vbtn" data-v="import">Import…</button><button type="button" class="vbtn" data-v="lock">Lock</button></div>' +
        '<div class="health"><button type="button" class="hc fine' + (U.filter === '' ? ' on' : '') + '" data-vf=""><b>' + all.length + '</b><span>saved on this Mac</span></button>' +
        '<button type="button" class="hc ' + (reused ? 'bad' : 'fine') + (U.filter === 'reused' ? ' on' : '') + '" data-vf="reused"><b>' + reused + '</b><span>used on more than one site</span></button>' +
        '<button type="button" class="hc ' + (weak ? 'bad' : 'fine') + (U.filter === 'weak' ? ' on' : '') + '" data-vf="weak"><b>' + weak + '</b><span>easy to guess</span></button></div>' +
        '<div class="vcols"><div class="vlist">' + (list.map(function(p){ return '<button type="button" class="vrow' + (cur && p.id === cur.id && !U.add ? ' on' : '') + '" data-vsel="' + esc(p.id) + '">' + mono(p) + '<span><b>' + esc(p.site) + '</b><small>' + esc(p.user || 'No name saved') + '</small></span>' +
          (p.verdict === 'weak' ? '<em title="Easy to guess"></em>' : p.verdict === 'reused' ? '<em class="amber" title="Used on more than one site"></em>' : '') + '</button>'; }).join('') ||
          '<p class="none">' + (all.length ? 'Nothing matches.' : 'No passwords yet. Sleek offers to save one when you sign in to a site, or use Add or Import.') + '</p>') + '</div>';
      if(U.add){ var a = U.add;
        h += '<div class="vcard" style="--c:#7C5CFF"><div class="vhead"><i class="mono" style="--c:#7C5CFF">+</i><span><b>A new sign-in</b><small>Kept on this Mac only</small></span></div><div class="vbody"><div class="form">' +
          '<label for="a-site">Site</label><input type="text" id="a-site" value="' + esc(a.site) + '" placeholder="example.com" autocomplete="off" spellcheck="false">' +
          '<label for="a-user">Name or email</label><input type="text" id="a-user" value="' + esc(a.user) + '" autocomplete="off" spellcheck="false">' +
          '<label for="a-pass">Password</label><input type="text" id="a-pass" value="' + esc(a.password) + '" autocomplete="off" spellcheck="false">' +
          '<div class="frow"><button type="button" class="vbtn main" data-v="addsave">Save</button><button type="button" class="vbtn" data-v="addmake">Suggest a strong one</button><button type="button" class="vbtn" data-v="addcancel">Cancel</button></div></div></div></div>';
      } else if(cur){ var vd = verdict(cur), shown = U.shown && U.shown.id === cur.id ? U.shown.text : null, ed = U.edit && U.edit.id === cur.id ? U.edit : null;
        h += '<div class="vcard" style="--c:' + colour(cur.site) + '"><div class="vhead">' + mono(cur) + '<span><b>' + esc(cur.site) + '</b><small>' + esc(cur.user || 'No name saved') + '</small></span><button type="button" class="vbtn" data-v="open">Open the site</button></div><div class="vbody">';
        if(ed) h += '<div class="form"><label for="e-site">Site</label><input type="text" id="e-site" value="' + esc(ed.site) + '" autocomplete="off" spellcheck="false"><label for="e-user">Name or email</label><input type="text" id="e-user" value="' + esc(ed.user) + '" autocomplete="off" spellcheck="false">' +
          '<label for="e-pass">Password</label><input type="text" id="e-pass" value="' + esc(ed.password) + '" autocomplete="off" spellcheck="false"><div class="frow"><button type="button" class="vbtn main" data-v="editsave">Save</button><button type="button" class="vbtn" data-v="editcancel">Cancel</button></div></div>';
        else h += '<div class="vf"><span><label>Name or email</label><b>' + esc(cur.user || '—') + '</b></span>' + (cur.user ? '<button type="button" class="vbtn" data-v="copyu">Copy</button>' : '') + '</div>' +
          '<div class="vf"><span><label>Password</label><code id="pw">' + (shown != null ? esc(shown) : new Array(Math.min(cur.length, 18) + 1).join('•')) + '</code><div class="meter"><i style="--w:' + vd[2] + ';--mc:' + vd[3] + '"></i></div><div class="verdict"><b style="color:' + vd[3] + '">' + vd[0] + '.</b> ' + vd[1] + '</div></span>' +
          '<button type="button" class="vbtn" data-v="show">' + (shown != null ? 'Hide' : 'Show') + '</button><button type="button" class="vbtn" data-v="copyp">Copy</button></div>' +
          (U.gen != null ? '<div class="gen"><b style="font-weight:600">A stronger one</b><code id="made">' + esc(U.gen) + '</code><div class="frow"><span class="seg"><button type="button" data-vk="chars" class="' + (U.words ? '' : 'on') + '">Letters and symbols</button><button type="button" data-vk="words" class="' + (U.words ? 'on' : '') + '">Words, easier to type</button></span>' +
            '<input type="range" min="12" max="32" value="' + U.length + '" id="vlen" aria-label="How long"><small>' + (U.gen ? U.gen.length : U.length) + ' long</small></div><div class="frow"><button type="button" class="vbtn main" data-v="use">Use this one</button><button type="button" class="vbtn" data-v="again">Another</button><button type="button" class="vbtn" data-v="nogen">Cancel</button></div>' +
            '<small style="color:var(--muted)">Sleek puts it on the clipboard and opens the site’s change-password page. Once the site has taken it, Sleek keeps it in place of the old one.</small></div>'
          : '<div class="vfoot" style="padding-top:12px"><span></span><button type="button" class="vbtn" data-v="gen">' + (cur.verdict === 'strong' ? 'Suggest a new one' : 'Suggest a stronger one') + '</button></div>');
        h += '<div class="vfoot"><span>Saved ' + when(cur.added) + ' · last filled ' + when(cur.used) + '</span>' + (ed ? '' : '<button type="button" class="vbtn" data-v="edit">Edit</button>') + '<button type="button" class="vbtn warn" data-v="delete">' + (U.del && Date.now() - U.del < 5000 ? 'Press again to delete' : 'Delete') + '</button></div></div></div>';
      } else h += '<div></div>';
      h += '</div><div class="settings"><div class="sw"><span>Offer to save a password when you sign in to a site</span><button type="button" role="switch" aria-checked="' + !!S.offer + '" data-v="offer" aria-label="Offer to save passwords"></button></div>' +
        (S.never.length ? '<div>Never offered for: <span class="chips">' + S.never.map(function(n){ return '<span class="chip">' + esc(n) + '<button type="button" data-allow="' + esc(n) + '" aria-label="Offer again for ' + esc(n) + '">×</button></span>'; }).join('') + '</span></div>' : '') +
        '<div class="frow"><span style="margin-right:auto">Import takes the passwords file that Chrome, Safari, Firefox or Edge exports.</span><button type="button" class="vbtn" data-v="export">Export to a file…</button></div></div>' +
        '<div class="vnote">Copying a password clears it from the clipboard after a minute. Nothing here is sent anywhere.</div></div>';
    }
    if(U.toast) h += '<div class="toast" role="status">' + esc(U.toast) + '</div>';
    app.innerHTML = h;
    var l = app.querySelector('.vlist'); if(l) l.scrollTop = listY;
    if(keep){ var again = document.getElementById(keep); if(again){ again.focus(); if(a0 != null) try { again.setSelectionRange(a0, a1); } catch(e){} } }
  }
  function curItem(){ return (S.items || []).filter(function(p){ return p.id === U.sel; })[0] || null; }
  function make(){ ask('make', { words: U.words, length: U.length }); }

  app.addEventListener('click', function(e){
    var t = e.target, x, c = curItem();
    if((x = t.closest('[data-vsel]'))){ U.sel = x.getAttribute('data-vsel'); U.shown = null; U.gen = null; U.edit = null; U.add = null; U.del = 0; paint(); return; }
    if((x = t.closest('[data-vf]'))){ U.filter = x.getAttribute('data-vf'); U.gen = null; U.edit = null; U.add = null; paint(); return; }
    if((x = t.closest('[data-vk]'))){ U.words = x.getAttribute('data-vk') === 'words'; make(); return; }
    if((x = t.closest('[data-allow]'))){ ask('allow', { site: x.getAttribute('data-allow') }); return; }
    if(!(x = t.closest('[data-v]'))) return;
    var what = x.getAttribute('data-v');
    if(what === 'unlock' || what === 'lock' || what === 'import' || what === 'export') ask(what);
    else if(what === 'offer') ask('offer', { on: !S.offer });
    else if(what === 'add'){ U.add = { site: '', user: '', password: '' }; U.edit = null; U.gen = null; paint(); var s = document.getElementById('a-site'); if(s) s.focus(); }
    else if(what === 'addcancel'){ U.add = null; paint(); }
    else if(what === 'addmake'){ U.making = 'add'; ask('make', { words: false, length: 20 }); }
    else if(what === 'addsave'){ ask('add', { site: U.add.site, user: U.add.user, password: U.add.password }); if(U.add.site.trim() && U.add.password){ U.q = ''; U.filter = ''; U.add = null; paint(); } }
    else if(!c) return;
    else if(what === 'show'){ if(U.shown && U.shown.id === c.id){ U.shown = null; paint(); } else ask('show', { id: c.id }); }
    else if(what === 'copyu') ask('copy', { id: c.id, of: 'user' });
    else if(what === 'copyp') ask('copy', { id: c.id, of: 'password' });
    else if(what === 'open') ask('open', { site: c.site });
    else if(what === 'gen'){ U.gen = ''; U.making = 'gen'; make(); }
    else if(what === 'again') make();
    else if(what === 'nogen'){ U.gen = null; paint(); }
    else if(what === 'use'){ if(U.gen){ ask('use', { id: c.id, password: U.gen }); U.gen = null; paint(); } }
    else if(what === 'edit'){ U.pendingEdit = c.id; ask('show', { id: c.id }); }      // the password is asked for, to edit it
    else if(what === 'editcancel'){ U.edit = null; paint(); }
    else if(what === 'editsave'){ ask('change', { id: c.id, site: U.edit.site, user: U.edit.user, password: U.edit.password }); U.edit = null; U.shown = null; paint(); }
    else if(what === 'delete'){ if(U.del && Date.now() - U.del < 5000){ U.del = 0; ask('delete', { id: c.id }); U.sel = null; } else { U.del = Date.now(); paint(); setTimeout(paint, 5100); } }
  });
  app.addEventListener('input', function(e){
    var t = e.target;
    if(t.id === 'vq'){ U.q = t.value; U.gen = null; paint(); }
    else if(t.id === 'vlen'){ U.length = +t.value; make(); }
    else if(U.add && /^a-(site|user|pass)$/.test(t.id)) U.add[t.id === 'a-pass' ? 'password' : t.id.slice(2)] = t.value;
    else if(U.edit && /^e-(site|user|pass)$/.test(t.id)) U.edit[t.id === 'e-pass' ? 'password' : t.id.slice(2)] = t.value;
  });
  app.addEventListener('keydown', function(e){ if(e.key !== 'Enter' || e.target.tagName !== 'INPUT') return; var b = app.querySelector(U.add ? '[data-v=addsave]' : U.edit ? '[data-v=editsave]' : null); if(b){ e.preventDefault(); b.click(); } });

  window.Passwords = {
    fill: function(s){ var was = S.open; S = s; S.items = s.items || []; S.never = s.never || []; if(s.still) document.documentElement.classList.add('still'); if(!S.open){ U.shown = null; U.gen = null; U.edit = null; U.add = null; } if(S.open && !was) U.sel = null; paint(); },
    shown: function(id, text){ if(U.pendingEdit === id){ U.pendingEdit = null; var c = curItem(); U.edit = { id: id, site: c ? c.site : '', user: c ? c.user : '', password: text }; U.gen = null; paint(); return; } U.shown = { id: id, text: text }; paint(); },
    made: function(text){ if(U.making === 'add' && U.add){ U.add.password = text; U.making = null; paint(); return; } U.gen = text; paint(); },
    note: function(text){ toast(text); }
  };
  // look again now and then, so the page locks itself when the vault has; and whenever it comes back into view
  setInterval(function(){ if(!document.hidden) ask('state'); }, 20000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) ask('state'); });
  paint(); ask('state');
})();
</script>
</body>
</html>
