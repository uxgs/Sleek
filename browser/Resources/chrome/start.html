<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<style>
  /* The page a new tab opens on: Sleek's mark, one box to search or type an address, your bookmarks,
     and the places you go most. It follows the window: light or dark. (Your day, from Sleek Tasks,
     arrives here in a later stage.) */
  :root { --bg: #FFFFFF; --fg: #1D1D1F; --muted: #6E6E73; --line: rgba(0,0,0,0.14); --card: #F4F4F7; --accent: #7C5CFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E0E11; --fg: #F2F2F5; --muted: #A1A1A6; --line: rgba(255,255,255,0.18); --card: #1B1B20; color-scheme: dark; } }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: 16vh 24px 60px; display: flex; flex-direction: column; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 700; letter-spacing: -0.04em; } .brand img { width: 40px; height: auto; display: block; }
  .private { font-size: 14px; color: var(--muted); margin: -14px 0 0; }
  form { display: flex; }
  input { flex: 1; min-width: 0; height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: inherit; font: inherit; font-size: 16px; padding: 0 18px; outline: none; }
  input:focus { border-color: var(--accent); background: var(--bg); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
  h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  a.site { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--card); color: inherit; text-decoration: none; min-width: 0; border: 1px solid transparent; }
  a.site:hover, a.site:focus-visible { border-color: var(--accent); outline: none; }
  a.site i { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--line); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 12px; }
  a.site span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .apps a.site i { background: none; } .apps a.site img { width: 22px; height: auto; display: block; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="sleek://app/icons/logo.svg" alt="">Sleek</div>
  <p class="private" id="private" hidden>Private: pages you open in this window are not kept in history, and its cookies are forgotten when you close it.</p>
  <form id="f"><input id="q" placeholder="Search the web, or type an address" aria-label="Search the web, or type an address" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></form>
  <section class="apps"><h2>Sleek</h2><div class="grid">
    <a class="site" href="sleek://app/slides.html"><i><img src="sleek://app/icons/slides.svg" alt=""></i><span>Slides</span></a>
    <a class="site" href="sleek://app/docs.html"><i><img src="sleek://app/icons/docs.svg" alt=""></i><span>Docs</span></a>
    <a class="site" href="sleek://app/tasks.html"><i><img src="sleek://app/icons/tasks.svg" alt=""></i><span>Tasks</span></a>
  </div></section>
  <section id="marks" hidden><h2>Bookmarks</h2><div class="grid" id="marks-g"></div></section>
  <section id="top" hidden><h2>Where you go most</h2><div class="grid" id="top-g"></div></section>
</main>
<script>
(function(){
  function post(m){ try { window.webkit.messageHandlers.sleekPage.postMessage(m); } catch(e){} }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function host(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return u; } }
  function tile(title, url){ return '<a class="site" href="' + esc(url) + '" title="' + esc(url) + '"><i>' + esc((host(url).charAt(0) || '?').toUpperCase()) + '</i><span>' + esc(title || host(url)) + '</span></a>'; }
  document.getElementById('f').addEventListener('submit', function(e){ e.preventDefault(); var v = document.getElementById('q').value.trim(); if(v) post({ go: v }); });
  window.Start = { fill: function(d){
    document.getElementById('private').hidden = !d.private;
    var m = d.bookmarks || [], t = (d.top || []).filter(function(x){ return /^https?:/.test(x.u); });
    document.getElementById('marks').hidden = !m.length; document.getElementById('marks-g').innerHTML = m.map(function(b){ return tile(b.title, b.url); }).join('');
    document.getElementById('top').hidden = !t.length; document.getElementById('top-g').innerHTML = t.map(function(x){ return tile(x.t, x.u); }).join('');
  } };
  post({ want: 'start' });
})();
</script>
</body>
</html>
