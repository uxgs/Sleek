# Sleek for iPhone. `./make.sh` turns this into an Xcode project (with xcodegen) and builds it.
# The app compiles five files of the Mac browser as they are (blocking, settings and history, known
# sites and icons, your Sleek work, and what both apps share), so the two never drift apart.
name: Sleek
options:
  bundleIdPrefix: com.sleek
  deploymentTarget:
    iOS: "17.0"
targets:
  Sleek:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../browser/Sources/Sleek/Common.swift
      - path: ../browser/Sources/Sleek/Blocker.swift
      - path: ../browser/Sources/Sleek/Store.swift
      - path: ../browser/Sources/Sleek/Known.swift
      - path: ../browser/Sources/Sleek/Work.swift
      - path: Assets.xcassets
      - path: build/inside/app
        type: folder
      - path: build/inside/lists
        type: folder
      - path: build/inside/chrome
        type: folder
      - path: build/inside/sites.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleek.browser
        PRODUCT_NAME: Sleek
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sleek
        INFOPLIST_KEY_NSCameraUsageDescription: A page you opened asked to use the camera.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: A page you opened asked to use the microphone.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Sleek uses Face ID to open your passwords.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
