# Sleek for iPhone. `./make.sh` turns this into an Xcode project (with xcodegen) and builds it.
# The app compiles six files of the Mac browser as they are (blocking, settings and history, known
# sites and icons, your Sleek work, passwords, and what both apps share), so the two never drift apart.
name: Sleek
options:
  bundleIdPrefix: com.sleek
  deploymentTarget:
    iOS: "17.0"
targets:
  Sleek:
    type: application
    platform: iOS
    dependencies:
      - target: SleekWidgets
    sources:
      - path: Sources
      - path: ../ios-shared/Shared.swift
      - path: ../ios-shared/Aisles.swift
      - path: ../ios-shared/Siri.swift
      - path: ../ios-shared/Goals.swift
      - path: ../ios-shared/SharedWork.swift
      - path: ../browser/Sources/Sleek/Common.swift
      - path: ../browser/Sources/Sleek/Blocker.swift
      - path: ../browser/Sources/Sleek/Store.swift
      - path: ../browser/Sources/Sleek/Known.swift
      - path: ../browser/Sources/Sleek/Work.swift
      - path: ../browser/Sources/Sleek/Vault.swift
      - path: ../browser/Sources/Sleek/Passkeys.swift
      - path: Assets.xcassets
      - path: Sounds
      - path: build/inside/app
        type: folder
      - path: build/inside/lists
        type: folder
      - path: build/inside/chrome
        type: folder
      - path: build/inside/sites.txt
      - path: build/inside/words.txt
    info:
      path: build/Info.plist
      properties:
        # whether Sleek Tasks, Docs and Slides are on this iPhone, to open your work there
        LSApplicationQueriesSchemes: [sleek-tasks, sleek-docs, sleek-slides, sleek-notes]
        # the widgets open Sleek here: the address bar, a private tab, a site or one of your pages
        CFBundleURLTypes:
          - CFBundleURLName: com.sleek.browser
            CFBundleURLSchemes: [sleek-browser]
    entitlements:
      path: build/Sleek.entitlements
      properties:
        com.apple.security.application-groups: [group.com.uxg.sleek]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleek.browser
        PRODUCT_NAME: Sleek
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sleek
        INFOPLIST_KEY_NSCameraUsageDescription: A page you opened asked to use the camera.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: A page you opened asked to use the microphone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: A page you opened asked where you are.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Sleek uses Face ID to open your passwords.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Sleek saves an image to Photos when you choose Save to Photos.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
  # the app's widgets (drawn by ../ios-shared/Widgets.swift), reading the work the Sleek apps share
  SleekWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: ../ios-shared/Widgets.swift
      - path: ../ios-shared/Shared.swift
      - path: ../ios-shared/Aisles.swift
      - path: ../ios-shared/Siri.swift
      - path: ../ios-shared/Goals.swift
    info:
      path: build/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Sleek
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: build/SleekWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.uxg.sleek]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleek.browser.widgets
        PRODUCT_NAME: SleekWidgets
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
