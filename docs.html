<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleek Docs</title>
<script src="core/analytics.js"></script>
<link rel="manifest" href="docs.webmanifest">
<link rel="icon" href="icons/docs-favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/docs-favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/docs-touch.png">
<meta name="theme-color" content="#0B0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sleek Docs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="glow.css">
<link rel="stylesheet" href="features/library.css">
<link rel="stylesheet" href="doc/library.css">
<!-- the storage (pictures live in the decks' store, pages in their own), and the page's look before paint -->
<script src="core/store.js"></script>
<script src="core/doc-store.js"></script>
<script src="core/online.js"></script>
<script src="theme-boot.js"></script>
<script>document.documentElement.style.setProperty('--accent', '#7C5CFF');</script>
<style>
  /* the same start screen as Sleek Slides (slides.html), for pages */
  :root {
    --bg: #FDFDFF; --surface: #FFFFFF; --surface-2: #F1F1F5;
    --fg: #1D1D1F; --muted: #6E6E73; --faint: #86868B;
    --line: rgba(0,0,0,0.10); --line-strong: rgba(0,0,0,0.18);
    --accent: #7C5CFF; --on-accent: #FFFFFF;
    --shadow: 0 40px 90px -46px rgba(0,0,0,0.3);
    --ff: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0B0B0D; --surface: #161719; --surface-2: #1E1F22;
    --fg: #F5F5F7; --muted: #A1A1A6; --faint: #6E6E73;
    --line: rgba(255,255,255,0.09); --line-strong: rgba(255,255,255,0.16);
    --shadow: 0 40px 100px -40px rgba(0,0,0,0.8);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--ff); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .start-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto;
         padding: 72px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; flex-wrap: wrap; }
  .brand img { display: block; width: 34px; height: auto; }
  .brand span { font-size: 25px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  h1 { font-size: clamp(40px, 7vw, 64px); line-height: 1.02; letter-spacing: -0.035em; margin: 10px 0 12px; font-weight: 650; text-wrap: balance; }
  .lede { font-size: 18px; color: var(--muted); max-width: 56ch; margin: 0 0 40px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: -16px 0 44px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
  .btn-ghost { border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font: 600 15px/1 var(--ff); transition: border-color .2s ease, background .2s ease; }
  .btn-ghost:hover { border-color: var(--line-strong); background: var(--surface); }
  .btn-new { border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; font: 600 15px/1 var(--ff); transition: transform .2s ease, border-color .2s ease; }
  .btn-new:hover { transform: translateY(-1px); border-color: var(--accent); }
  .btn-new .plus { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 14px; line-height: 1; }
</style>
</head>
<body>
<div class="start-glow glow" data-fx aria-hidden="true"></div>
<main>
  <div class="brand"><nav class="trail" aria-label="Where you are"><a class="brand-home" href="index.html" title="Back to Sleek, to pick another app"><img src="icons/docs.svg" alt="" width="34" height="31"><span>Sleek</span></a><i aria-hidden="true">/</i><b aria-current="page">Docs</b></nav><a class="ver" id="ver" href="#whats-new" hidden></a></div>
  <h1>Write Something Worth Reading.</h1>
  <p class="lede">Pages save as you write. No account, nothing to install, and it works offline.</p>

  <div class="actions">
    <a class="btn btn-new" href="doc.html?new=1"><span class="plus" aria-hidden="true">+</span>New page</a>
    <button type="button" class="btn btn-ghost" id="dl-open">Open a file…</button>
    <input type="file" id="dl-file" accept=".sleek,.docx,.md,.markdown,.txt,text/markdown,text/plain,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>
  </div>

  <section class="lib" aria-labelledby="dl-h">
    <div class="lib-head"><h2 id="dl-h">Your pages</h2><span class="lib-count" id="dl-count"></span></div>
    <div class="lib-grid dl-grid" id="dl-grid" aria-live="polite"></div>
  </section>

  <section class="news" id="whats-new" aria-labelledby="news-h" hidden>
    <h2 class="news-h2"><button type="button" class="news-head" id="news-toggle" aria-expanded="false" aria-controls="news-box">
      <span class="news-name" id="news-h">What’s new in Docs</span><span class="lib-count" id="news-ver"></span>
      <span class="news-peek" id="news-peek"></span>
      <svg class="news-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button></h2>
    <div class="news-box" id="news-box" hidden>
      <ol class="news-list" id="news-list"></ol>
      <button type="button" class="lib-link news-more" id="news-more" aria-expanded="false" aria-controls="news-list" hidden></button>
    </div>
  </section>
</main>
<div class="lib-drop" id="dl-drop" aria-hidden="true"><div><b>Drop to open</b><span>A .sleek page, or a Word, Markdown or text file</span></div></div>
<script src="glow-fx.js"></script>
<script src="doc/import.js"></script>
<script src="doc/library.js"></script>
<!-- Docs has its own version and notes; the start screen's What's new (features/changelog.js) reads them as its list -->
<script src="data/doc-changelog.js"></script>
<script>window.SLEEK_CHANGES = window.SLEEK_DOC_CHANGES;</script>
<script src="features/changelog.js"></script>
<script src="core/short.js"></script>
</body>
</html>
