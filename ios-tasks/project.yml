# Sleek Tasks for iPhone. `./make.sh` turns this into an Xcode project (with xcodegen) and builds it.
name: SleekTasks
options:
  bundleIdPrefix: com.sleek
  deploymentTarget:
    iOS: "17.0"
targets:
  SleekTasks:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Sleek Tasks
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
        # a .sleek file (the copy Sleek Tasks saves, here and on the web) can be opened with this app
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sleek.file
            UTTypeDescription: Sleek file
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [sleek]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sleek file
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.sleek.file]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleek.tasks
        PRODUCT_NAME: SleekTasks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
